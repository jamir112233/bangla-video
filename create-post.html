<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Post - Vidzora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #08090d;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
    }

    h1 {
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #151720;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #7c4dff;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #aaa;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back" href="index.html">← Back to Home</a>

    <h1>Create New Post</h1>

    <label>Video Title</label>
    <input id="title" type="text" placeholder="ভিডিওর নাম লিখুন">

    <label>Video Link</label>
    <input id="videoUrl" type="url" placeholder="https://...">

    <label>Category</label>
    <select id="category">
      <option value="entertainment">Entertainment</option>
      <option value="tech">Tech</option>
      <option value="education">Education</option>
    </select>

    <label>Description</label>
    <textarea id="description" placeholder="ভিডিও সম্পর্কে কিছু লিখুন"></textarea>

    <button onclick="createPost()">Publish Post</button>

  </div>

  <script>
    function createPost() {

      const title = document.getElementById("title").value.trim();
      const videoUrl = document.getElementById("videoUrl").value.trim();
      const category = document.getElementById("category").value;
      const description = document.getElementById("description").value.trim();

      if (!title || !videoUrl) {
        alert("Title এবং Video Link দিতে হবে!");
        return;
      }

      const post = {
        title: title,
        videoUrl: videoUrl,
        category: category,
        description: description
      };

      let posts = JSON.parse(localStorage.getItem("vidzoraPosts") || "[]");

      posts.push(post);

      localStorage.setItem("vidzoraPosts", JSON.stringify(posts));

      alert("Post তৈরি হয়েছে!");

      window.location.href = "index.html";
    }
  </script>

</body>
  </html>
